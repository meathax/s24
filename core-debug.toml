schema_version = 1

[core]
name = "Sega System 24"
platform = "MiSTer"
top = "Arcade-SegaSystem24.sv"
status_file = "docs/status.md"
current_gate = "gground-cnt1-release-and-cpu-b"
next_gate = "gground-protected-cpu-b-execution"

[reference]
emulator = "MAME"
version = "0.288"
commit = "affe701f9210d003d2cc5eff311f94053afa679b"
source_root = "D:/Arcade/AI/MAMESOURCE/mame"
driver_files = [
  "src/mame/sega/segas24.cpp",
  "src/mame/sega/segaic24.cpp",
  "src/mame/sega/315_5296.cpp",
  "src/mame/sega/fd1094.cpp",
]
known_imperfect = ["crkdown"]

[commands]
validate_rom_archives = "python tools/gen_mra.py --out-dir verif/modelsim_mra_baseline"
validate_media_matrix = "python tools/run_game_matrix.py --exe verif/obj_gground/Vtb_gground_boot.exe --dry-run --target 0"
prepare_media = "python tools/gen_sim_media.py --all"
build_sim = "powershell -ExecutionPolicy Bypass -File tools/build_game_model.ps1"
run_gground_full_track = "python tools/run_game_matrix.py --exe verif/obj_gground/Vtb_gground_boot.exe --sets gground --target 5 --max-clocks 260000000"
run_gground_cnt1_release = "python tools/run_game_matrix.py --exe verif/obj_gground/Vtb_gground_boot.exe --sets gground --target 1 --max-clocks 720000000"
run_gground_cpu_b_execution = "python tools/run_game_matrix.py --exe verif/obj_gground/Vtb_gground_boot.exe --sets gground --target 2 --max-clocks 900000000"
run_all_first_media = "python tools/run_game_matrix.py --exe verif/obj_gground/Vtb_gground_boot.exe --target 0"

[artifacts]
private = ["roms/", "verif/media/", "verif/mame/*/"]
generated = ["C:/tmp/s24_obj_gground/", "verif/obj_*/", "verif/modelsim_*/", "verif/frames/", "verif/captures/"]
preserve_between_runs = ["C:/tmp/s24_obj_gground/", "verif/obj_gground/", "db/", "incremental_db/"]

[video]
width = 496
height = 384
rotation = "descriptor-specific"
capture_format = "P6"

[[sets]]
name = "sspirits"
role = "floppy-only"
features = ["floppy-0x2d00", "rotation-270"]

[[sets]]
name = "gground"
role = "protected-floppy"
features = ["fd1094", "floppy-0x2d00", "three-player-io", "temporary-7mhz-cpu-b"]

[[sets]]
name = "hotrod"
role = "analog-family"
features = ["floppy-0x2f00", "upd4701", "msm6253", "hotrod-io"]

[[sets]]
name = "roughrac"
role = "protected-floppy-analog"
features = ["fd1094", "floppy-0x2d00", "upd4701"]

[[sets]]
name = "bnzabros"
role = "combined-media"
features = ["writable-floppy", "rom-board", "bnzabros-magic"]

[[sets]]
name = "dcclub"
role = "golf-analog-rom"
features = ["rom-board", "upd4701", "golf-io", "dcclub-magic"]

[[sets]]
name = "crkdown"
role = "sprite-clipping"
features = ["fd1094", "reverse-y-clipping", "large-sprite-addressing", "mame-imperfect-graphics"]
