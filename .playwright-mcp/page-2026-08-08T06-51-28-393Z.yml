                  - paragraph [ref=f9e1376]: MiSTer FPGA implementation of the Sega System 32 arcade hardware (1990–1994).
                  - generic [ref=f9e1377]:
                    - heading "Hardware Overview" [level=2] [ref=f9e1378]
                    - 'link "Permalink: Hardware Overview" [ref=f9e1379] [cursor=pointer]':
                      - /url: "#hardware-overview"
                  - paragraph [ref=f9e1382]: "The Sega System 32 board uses:"
                  - list [ref=f9e1383]:
                    - listitem [ref=f9e1384]:
                      - strong [ref=f9e1385]: CPU
                      - text: ": NEC V60 (uPD70615) @ 16 MHz — 16-bit external data bus, 24-bit address bus"
                    - listitem [ref=f9e1386]:
                      - strong [ref=f9e1387]: Video
                      - text: ": 5 tilemap layers (TEXT 8×8 + NBG0-3 16×16), double-buffered sprites (linked-list), bitmap mode, palette RAM (R5G5B5)"
                    - listitem [ref=f9e1388]:
                      - strong [ref=f9e1389]: Resolution
                      - text: ": 320×224 @ ~60 Hz (standard mode); 416×224 wide mode"
                    - listitem [ref=f9e1390]:
                      - strong [ref=f9e1391]: Audio
                      - text: ": Z80 sound CPU + YM3438 (OPN2C) + 2× RF5C164 PCM (stubbed in this revision)"
                    - listitem [ref=f9e1392]:
                      - strong [ref=f9e1393]: I/O
                      - text: ": 315-5296 custom I/O chip (joystick, coin, DIP, EEPROM)"
