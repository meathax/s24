                  - paragraph [ref=f15e1367]:
                    - code [ref=f15e1368]: BIDIR_DUAL_PORT
                    - text: mode in Quartus 17.0 triggers a cascade of errors (272006, 287078) that are extremely difficult to fully resolve because of undocumented requirements around
                    - code [ref=f15e1369]: byteena_b
