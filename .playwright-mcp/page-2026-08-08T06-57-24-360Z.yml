                  - paragraph [ref=f15e2221]:
                    - strong [ref=f15e2222]: "Fix needed:"
                    - text: "Redesign tc0480scp_vram to time-multiplex the 4 bg_tf reads and 4 bg_sc reads through single shared ports (arbiter + round-robin), reducing to 1W + 3R (bg_mux + cpu + text):"
                  - list [ref=f15e2223]:
