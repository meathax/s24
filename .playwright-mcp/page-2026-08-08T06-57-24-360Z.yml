                  - separator [ref=f15e1909]
                  - generic [ref=f15e1910]:
                    - heading "21. Large Arrays With Combinational Reads OOM (Error 293007) — MLAB vs M10K" [level=2] [ref=f15e1911]
                    - 'link "Permalink: 21. Large Arrays With Combinational Reads OOM (Error 293007) — MLAB vs M10K" [ref=f15e1912] [cursor=pointer]':
                      - /url: "#21-large-arrays-with-combinational-reads-oom-error-293007--mlab-vs-m10k"
                  - paragraph [ref=f15e1915]:
                    - text: Any large unpacked array with a
                    - strong [ref=f15e1916]: combinational (async) read
                    - text: (
                    - code [ref=f15e1917]: assign q = ram[addr]
                    - text: ) blocks BRAM inference in Quartus 17.0. Quartus tries to synthesize the whole array as flip-flops, which instantly OOMs quartus_map (Error 293007) for anything >a few KB.
                  - paragraph [ref=f15e1918]:
                    - strong [ref=f15e1919]: "Root cause:"
                    - text: Quartus 17.0 BRAM inference requires
                    - emphasis [ref=f15e1920]: registered
                    - text: (synchronous) reads. Combinational reads prevent M10K inference. The fallback is N×W flip-flops — too expensive.
                  - generic [ref=f15e1921]:
                    - heading "Decision matrix" [level=3] [ref=f15e1922]
                    - 'link "Permalink: Decision matrix" [ref=f15e1923] [cursor=pointer]':
