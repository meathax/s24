                          - text: sufficient
                  - paragraph [ref=f15e1951]:
                    - strong [ref=f15e1952]: "MLAB capacity rough guide (Cyclone V, 41,910 ALMs):"
                  - list [ref=f15e1953]:
                    - listitem [ref=f15e1954]: Each ALM = 64-bit MLAB
                    - listitem [ref=f15e1955]: N-entry × W-bit array needs N×W/64 ALMs
                    - listitem [ref=f15e1956]: 8K×16 = 128 Kbits → 2,048 ALMs (OK)
                    - listitem [ref=f15e1957]: 32K×16 = 512 Kbits → 8,192 ALMs (marginal — ~20% of device, use only if necessary)
                    - listitem [ref=f15e1958]: 14K×72 = 1 Mbit → 16,384 ALMs (too large — use M10K + registered read)
                  - paragraph [ref=f15e1959]:
                    - strong [ref=f15e1960]: "MLAB pattern (for arrays with combinational reads):"
                  - generic [ref=f15e1961]:
                    - generic [ref=f15e1962]:
                      - text: "`ifdef QUARTUS (* ramstyle = \"MLAB\" *) logic [15:0] spr_ram [0:8191]; `else logic [15:0] spr_ram [0:8191]; `endif"
