                  - separator [ref=f15e1885]
                  - generic [ref=f15e1886]:
                    - heading "20. Small Reset Loops (4–16 elements) OOM When Cumulative" [level=2] [ref=f15e1887]
                    - 'link "Permalink: 20. Small Reset Loops (4–16 elements) OOM When Cumulative" [ref=f15e1888] [cursor=pointer]':
                      - /url: "#20-small-reset-loops-416-elements-oom-when-cumulative"
                  - paragraph [ref=f15e1891]:
                    - text: Individual
                    - code [ref=f15e1892]: for (int i = 0; i < 4; i++)
                    - text: loops in
                    - code [ref=f15e1893]: always_ff
                    - text: reset blocks are small enough that Quartus may not error on any individual one. But when a module has MANY such loops (>10 loops across multiple packed 2D output ports in one reset block), the cumulative elaboration overhead can OOM quartus_map (Error 293007).
                  - paragraph [ref=f15e1894]:
                    - strong [ref=f15e1895]: "Fix: replace all reset loops with explicit element-by-element assignments:"
                  - generic [ref=f15e1896]:
                    - generic [ref=f15e1897]:
                      - generic [ref=f15e1898]: "// Instead of (potentially OOMs with many such loops per module):"
                      - text: for (int i = 0; i < 4; i++) ls_rowscroll[i] <= 16'b0; for (int j = 0; j < 4; j++) ls_zoom_x[j] <= 8'h00;
                      - generic [ref=f15e1899]: // ... 13 more loops like this ...
                      - generic [ref=f15e1900]: "// Use explicit assignments:"
                      - text: ls_rowscroll[0] <= 16'b0; ls_rowscroll[1] <= 16'b0; ls_rowscroll[2] <= 16'b0; ls_rowscroll[3] <= 16'b0; ls_zoom_x[0] <= 8'h00; ls_zoom_x[1] <= 8'h00;
                      - generic [ref=f15e1901]: // ... etc ...
