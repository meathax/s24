                      - text: logic [2303:0] dl_x;
                      - generic [ref=f15e1835]: // flat wire
                      - text: .display_list_x(dl_x),
                      - generic [ref=f15e1836]: // no auto-generated nets
                      - generic [ref=f15e1837]: "// Access element N: dl_x[N*9 +: 9]"
                    - button "Copy code to clipboard" [ref=f15e1839] [cursor=pointer]
                  - paragraph [ref=f15e1843]:
                    - strong [ref=f15e1844]: Small 2D ports (4 elements or fewer)
