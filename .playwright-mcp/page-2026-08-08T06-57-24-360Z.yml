                      - row [ref=f15e1934]:
                        - cell "≤ 512 Kbits" [ref=f15e1935]
                        - cell [ref=f15e1936]:
                          - text: Combinational (
                          - code [ref=f15e1937]: assign q = ram[addr]
                          - text: )
                        - cell [ref=f15e1938]:
                          - code [ref=f15e1939]: (* ramstyle = "MLAB" *)
                          - text: — Cyclone V MLAB supports async read
