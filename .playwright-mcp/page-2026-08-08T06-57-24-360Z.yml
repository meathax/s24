                  - separator [ref=f15e2119]
                  - generic [ref=f15e2120]:
                    - heading "24. Warning 10999 — MLAB/M10K Inference Failure Due to Multi-Port Writes" [level=2] [ref=f15e2121]
                    - 'link "Permalink: 24. Warning 10999 — MLAB/M10K Inference Failure Due to Multi-Port Writes" [ref=f15e2122] [cursor=pointer]':
                      - /url: "#24-warning-10999--mlabm10k-inference-failure-due-to-multi-port-writes"
                  - paragraph [ref=f15e2125]:
                    - code [ref=f15e2126]: "Warning (10999): can't infer memory for variable '<name>' with attribute '\"MLAB\"'."
                  - paragraph [ref=f15e2127]:
                    - text: This warning means Quartus's structural BRAM inference engine
                    - strong [ref=f15e2128]: refuses to infer
                    - text: the array as MLAB (or M10K), regardless of the
                    - code [ref=f15e2129]: ramstyle
                    - text: attribute. The array falls back to flip-flops + combinational mux trees — causing OOM (Error 293007) for large arrays.
                  - paragraph [ref=f15e2130]:
                    - strong [ref=f15e2131]: "Root causes:"
                  - generic [ref=f15e2132]:
                    - heading [level=3] [ref=f15e2133]:
                      - text: (a) Multiple write ports in a single
                      - code [ref=f15e2134]: always_ff
                      - text: block
                    - 'link "Permalink: (a) Multiple write ports in a single always_ff block" [ref=f15e2135] [cursor=pointer]':
                      - /url: "#a-multiple-write-ports-in-a-single-always_ff-block"
                  - generic [ref=f15e2138]:
                    - generic [ref=f15e2139]:
                      - text: always_ff @(posedge clk) begin if (cs && !cpu_rw) spr_ram[cpu_addr] <= cpu_din;
                      - generic [ref=f15e2140]: // write port 1
                      - text: if (tb_wr_en) spr_ram[tb_addr] <= tb_data;
                      - generic [ref=f15e2141]: // write port 2 ← BLOCKS INFERENCE
                      - text: end
                    - button "Copy code to clipboard" [ref=f15e2143] [cursor=pointer]
                  - paragraph [ref=f15e2147]:
                    - text: Even if
                    - code [ref=f15e2148]: tb_wr_en
                    - text: is tied to
                    - code [ref=f15e2149]: 1'b0
                    - text: at the instantiation level, the structural analyzer sees the two-write-port pattern
                    - strong [ref=f15e2150]: before
                    - text: constant propagation and refuses inference.
                  - paragraph [ref=f15e2151]:
                    - strong [ref=f15e2152]: "Fix:"
                    - text: Exclude the testbench write port from synthesis using
                    - code [ref=f15e2153]: "`ifndef QUARTUS"
                    - text: ":"
                  - generic [ref=f15e2154]:
                    - generic [ref=f15e2155]:
                      - text: "always_ff @(posedge clk) begin if (cs && !cpu_rw) spr_ram[cpu_addr] <= cpu_din; `ifndef QUARTUS if (tb_wr_en) spr_ram[tb_addr] <= tb_data;"
                      - generic [ref=f15e2156]: // simulation only
                      - text: "`endif end"
                    - button "Copy code to clipboard" [ref=f15e2158] [cursor=pointer]
                  - generic [ref=f15e2162]:
                    - heading "(b) Writes to different addresses from the same byte-enable condition" [level=3] [ref=f15e2163]
                    - 'link "Permalink: (b) Writes to different addresses from the same byte-enable condition" [ref=f15e2164] [cursor=pointer]':
                      - /url: "#b-writes-to-different-addresses-from-the-same-byte-enable-condition"
                  - generic [ref=f15e2167]:
                    - generic [ref=f15e2168]:
                      - text: always_ff @(posedge clk) begin if (cs && !cpu_rw) begin
                      - generic [ref=f15e2169]: "// These are TWO different word addresses — not a byte-enable pattern:"
                      - text: "if (be[1]) char_ram[{word_addr, 1'b0}] <= din[15:8];"
                      - generic [ref=f15e2170]: // addr = word_addr*2
                      - text: "if (be[0]) char_ram[{word_addr, 1'b1}] <= din[ 7:0];"
                      - generic [ref=f15e2171]: // addr = word_addr*2+1
                      - text: end end
                    - button "Copy code to clipboard" [ref=f15e2173] [cursor=pointer]
                  - paragraph [ref=f15e2177]:
                    - text: This pattern arises with byte-addressed 8-bit arrays. The appended
                    - code [ref=f15e2178]: 1'b0
                    - text: /
                    - code [ref=f15e2179]: 1'b1
                    - text: selects different 8-bit words at adjacent addresses — not byte-enable lanes on the same word.
                  - paragraph [ref=f15e2180]:
                    - strong [ref=f15e2181]:
                      - text: Fix under
                      - code [ref=f15e2182]: ifdef QUARTUS
                      - text: ":"
                    - text: "Widen the array to match the natural CPU access width (16-bit or 32-bit) and use the standard byte-enable pattern (all writes to same word address):"
                  - generic [ref=f15e2183]:
                    - generic [ref=f15e2184]:
                      - text: "`ifdef QUARTUS (* ramstyle ="
                      - generic [ref=f15e2185]: "\"MLAB\""
                      - text: "*) logic [31:0] char_ram [0:2047];"
                      - generic [ref=f15e2186]: // 2048×32-bit = 64Kbits
                      - generic [ref=f15e2187]: "// CPU write: single 32-bit word address, 4-byte-enable (MLAB-inferrable)"
                      - text: always_ff @(posedge clk) begin if (cs && !cpu_rw) begin if (!word_addr[0]) begin
                      - generic [ref=f15e2188]: // lower 16-bit half
                      - text: if (be[1]) char_ram[word_addr[11:1]][15:8] <= din[15:8]; if (be[0]) char_ram[word_addr[11:1]][ 7:0] <= din[ 7:0]; end else begin
                      - generic [ref=f15e2189]: // upper 16-bit half
                      - text: if (be[1]) char_ram[word_addr[11:1]][31:24] <= din[15:8]; if (be[0]) char_ram[word_addr[11:1]][23:16] <= din[ 7:0]; end end end
                      - generic [ref=f15e2190]: "// Single 32-bit async read (engine):"
                      - text: assign char_q_w = char_ram[rd_addr_w];
                      - generic [ref=f15e2191]: // rd_addr_w is 11-bit → 2048 entries
                      - text: "`else"
                      - generic [ref=f15e2192]: "// Simulation: original byte-addressed array"
                      - text: "logic [7:0] char_ram [0:8191]; ... `endif"
                    - button "Copy code to clipboard" [ref=f15e2194] [cursor=pointer]
                  - paragraph [ref=f15e2198]:
                    - strong [ref=f15e2199]: "Key insight:"
                    - text: The byte-enable fix requires widening the array from 8-bit to 32-bit entries under
                    - code [ref=f15e2200]: ifdef QUARTUS
                    - text: ", so the CPU write goes to a"
                    - strong [ref=f15e2201]: single word address
                    - text: with
                    - strong [ref=f15e2202]: 4 independent byte-enable lanes
                    - text: (which Quartus 17.0 CAN infer as MLAB), and the engine read becomes a
                    - strong [ref=f15e2203]: single 32-bit async access
                    - text: (instead of 4 separate 8-bit accesses to adjacent addresses).
                  - separator [ref=f15e2204]
                  - generic [ref=f15e2205]:
                    - 'heading "25. Taito Z vram: Fundamental M10K Capacity Issue" [level=2] [ref=f15e2206]'
                    - 'link "Permalink: 25. Taito Z vram: Fundamental M10K Capacity Issue" [ref=f15e2207] [cursor=pointer]':
                      - /url: "#25-taito-z-vram-fundamental-m10k-capacity-issue"
                  - paragraph [ref=f15e2210]:
                    - code [ref=f15e2211]: tc0480scp_vram
                    - text: has 1 write port + 10 simultaneous read ports (4 bg_tf, 4 bg_sc, CPU, text_map, text_gfx). With
                    - code [ref=f15e2212]: ramstyle = "M10K"
