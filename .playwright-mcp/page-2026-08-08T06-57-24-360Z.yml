                  - paragraph [ref=f15e1228]: Lessons learned porting SystemVerilog RTL to Quartus 17.0.2 Lite Edition on Cyclone V (DE-10 Nano). Every item here was a real synthesis failure encountered during the MiSTer Pipeline CI bring-up.
