                  - separator [ref=f15e2065]
                  - generic [ref=f15e2066]:
                    - heading "22. Registered-Read BRAM Latency — Pre-Advance Address by +1" [level=2] [ref=f15e2067]
                    - 'link "Permalink: 22. Registered-Read BRAM Latency — Pre-Advance Address by +1" [ref=f15e2068] [cursor=pointer]':
                      - /url: "#22-registered-read-bram-latency--pre-advance-address-by-1"
                  - paragraph [ref=f15e2071]:
                    - text: When converting a combinational read to a registered (synchronous) read for M10K inference, data appears
                    - strong [ref=f15e2072]: 1 cycle after
                    - text: the address. In display pipelines, the read address is typically the current pixel position, so data arrives one pixel late.
                  - paragraph [ref=f15e2073]:
                    - strong [ref=f15e2074]: "Fix: pre-advance the read address by +1 to compensate:"
                  - generic [ref=f15e2075]:
                    - generic [ref=f15e2076]:
                      - text: "`ifdef QUARTUS out_rd_x = hpos[8:0] + 9'd1;"
                      - generic [ref=f15e2077]: "// pre-advance: data arrives next cycle = current pixel"
                      - text: "`else out_rd_x = hpos[8:0];"
                      - generic [ref=f15e2078]: "// simulation: combinational = same cycle"
                      - text: "`endif"
                    - button "Copy code to clipboard" [ref=f15e2080] [cursor=pointer]
                  - paragraph [ref=f15e2084]:
                    - strong [ref=f15e2085]: "When this is needed:"
                    - text: any
                    - code [ref=f15e2086]: always_ff
                    - text: read where the read address is set and the data is consumed in the same conceptual cycle (same state machine step, same scan position).
                  - paragraph [ref=f15e2087]:
                    - strong [ref=f15e2088]: "When it is NOT needed:"
                    - text: FSMs where there is already a 1-cycle gap between address and data consumption ("state N sets address, state N+1 reads data"). These are already compatible with registered reads — the gap exists naturally.
                  - paragraph [ref=f15e2089]: The "FSM-safe" label in the MLAB table above means the FSM already has a gap, so conversion to registered reads would also work if needed. MLAB is preferred for simplicity.
                  - separator [ref=f15e2090]
