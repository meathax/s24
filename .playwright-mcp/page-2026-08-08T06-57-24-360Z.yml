                  - paragraph [ref=f15e1811]:
                    - strong [ref=f15e1812]: The previous recommendation (Section 6) is INCOMPLETE.
                    - text: While it's true you should not use unpacked ports, packed 2D ports also fail for larger arrays. The correct approach is to flatten large packed 2D ports to flat 1D at the port boundary.
                  - paragraph [ref=f15e1813]:
                    - strong [ref=f15e1814]: "Fails — packed 2D port:"
