                  - generic [ref=f14e355]:
                    - generic [ref=f14e356]: //
                    - text: fx68k_dtack_cen.sv — DTACK-aware clock enable generator for fx68k
                  - generic [ref=f14e357]: //
                  - generic [ref=f14e365]:
                    - generic [ref=f14e366]: //
                    - text: Clean-room implementation of the "stall CPU clock during bus wait" pattern
                  - generic [ref=f14e370]:
                    - generic [ref=f14e371]: //
                    - text: used by all production MiSTer 68000 cores. Without this, the CPU's enPhi2
                  - generic [ref=f14e375]:
                    - generic [ref=f14e376]: //
                    - text: can fire before DTACK (and therefore before SDRAM data arrives), causing the
                  - generic [ref=f14e380]:
                    - generic [ref=f14e381]: //
                    - text: CPU to latch stale data from the previous bus cycle.
                  - generic [ref=f14e382]: //
                  - generic [ref=f14e390]:
                    - generic [ref=f14e391]: //
                    - text: "Behavior:"
                  - generic [ref=f14e395]:
                    - generic [ref=f14e396]: //
                    - text: "- Generates enPhi1 / enPhi2 at the target CPU frequency using a fractional"
                  - generic [ref=f14e400]:
                    - generic [ref=f14e401]: //
                    - text: accumulator (num/den ratio of clk_sys).
                  - generic [ref=f14e405]:
                    - generic [ref=f14e406]: //
                    - text: "- When a bus cycle is active (ASn=0) and DTACK hasn't fired yet (DTACKn=1),"
                  - generic [ref=f14e410]:
                    - generic [ref=f14e411]: //
                    - text: the clock enable generation is STALLED. No enPhi1 or enPhi2 pulses are
                  - generic [ref=f14e415]:
                    - generic [ref=f14e416]: //
                    - text: emitted until DTACKn goes low, ensuring the CPU only advances when valid
                  - generic [ref=f14e420]:
                    - generic [ref=f14e421]: //
                    - text: data is on the bus.
                  - generic [ref=f14e425]:
                    - generic [ref=f14e426]: //
                    - text: "- After DTACK fires, clock generation resumes normally."
                  - generic [ref=f14e427]: //
                  - generic [ref=f14e435]:
                    - generic [ref=f14e436]: //
                    - text: "Parameters:"
                  - generic [ref=f14e440]:
                    - generic [ref=f14e441]: //
                    - text: "NUM, DEN — fractional divider: CPU freq = clk_sys * NUM / DEN / 2"
                  - generic [ref=f14e445]:
                    - generic [ref=f14e446]: //
                    - text: (the /2 is because enPhi1 and enPhi2 alternate)
                  - generic [ref=f14e450]:
                    - generic [ref=f14e451]: //
                    - text: "Example: 40 MHz clk_sys, NUM=1, DEN=2 → 10 MHz CPU"
                  - generic [ref=f14e455]:
                    - generic [ref=f14e456]: //
                    - text: 48 MHz clk_sys, NUM=5, DEN=24 → 10 MHz CPU
                  - generic [ref=f14e457]: //
                  - generic [ref=f14e465]:
                    - generic [ref=f14e466]: //
                    - text: "Ports:"
                  - generic [ref=f14e470]:
                    - generic [ref=f14e471]: //
                    - text: enPhi1, enPhi2 — connect directly to fx68k
                  - generic [ref=f14e475]:
                    - generic [ref=f14e476]: //
                    - text: DTACKn, ASn — directly from fx68k outputs (active-low)
                  - generic [ref=f14e477]: //
                  - generic [ref=f14e485]:
                    - generic [ref=f14e486]: //
                    - text: Based on the documented behavior of the jtframe_68kdtack module used in
                  - generic [ref=f14e490]:
                    - generic [ref=f14e491]: //
                    - text: jotego cores (GPL-3.0). This is an independent implementation.
                  - generic [ref=f14e495]:
