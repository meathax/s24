                    - generic [ref=f13e6457]:
                      - generic [ref=f13e6458]: //
                      - text: "SECTION 9: NBG0 Layer — 16×16 tilemap with scroll and page select"
                    - generic [ref=f13e6462]:
                      - generic [ref=f13e6463]: //
                      - text: =============================================================================
                    - generic [ref=f13e6464]: //
                    - generic [ref=f13e6472]:
                      - generic [ref=f13e6473]: //
                      - text: "Architecture:"
                    - generic [ref=f13e6477]:
                      - generic [ref=f13e6478]: //
                      - text: "- Tilemap is arranged as four pages in a 2×2 grid (UL/UR/LL/LR)."
                    - generic [ref=f13e6482]:
                      - generic [ref=f13e6483]: //
                      - text: "- Each page = 32 columns × 16 rows of 16×16 tiles = 512 entries."
                    - generic [ref=f13e6487]:
                      - generic [ref=f13e6488]: //
                      - text: "- Page VRAM base address (word) = page_num × 512."
                    - generic [ref=f13e6492]:
                      - generic [ref=f13e6493]: //
                      - text: "- Tile entry (16-bit):"
                    - generic [ref=f13e6497]:
                      - generic [ref=f13e6498]: //
                      - text: bit15 = flipY
                    - generic [ref=f13e6502]:
                      - generic [ref=f13e6503]: //
                      - text: bit14 = flipX
                    - generic [ref=f13e6507]:
                      - generic [ref=f13e6508]: //
                      - text: bits[13:4] = color (10-bit palette field; bits overlap with tile code)
                    - generic [ref=f13e6512]:
                      - generic [ref=f13e6513]: //
                      - text: bits[12:0] = tile code (13 bits)
                    - generic [ref=f13e6517]:
                      - generic [ref=f13e6518]: //
                      - text: "- Tile GFX in ROM: 16×16×4bpp = 128 bytes per tile."
                    - generic [ref=f13e6522]:
                      - generic [ref=f13e6523]: //
                      - text: Byte address = tile_code × 128 + row_within_tile × 8 + word_within_row × 4
                    - generic [ref=f13e6527]:
                      - generic [ref=f13e6528]: //
                      - text: "Each 32-bit gfx_data read = 8 pixels (pixel k = bits[4k+3 : 4k])."
                    - generic [ref=f13e6532]:
                      - generic [ref=f13e6533]: //
                      - text: "Row has 2 × 32-bit reads: word0 = pixels 0-7, word1 = pixels 8-15."
                    - generic [ref=f13e6537]:
                      - generic [ref=f13e6538]: //
                      - text: "- Scroll: reg_nbg0_xscrl[9:0] = X scroll (pixel units, wraps in 512-wide tilespace)."
                    - generic [ref=f13e6542]:
                      - generic [ref=f13e6543]: //
                      - text: reg_nbg0_yscrl[8:0] = Y scroll (pixel units, wraps in 256-high tilespace).
                    - generic [ref=f13e6547]:
                      - generic [ref=f13e6548]: //
                      - text: "- Page layout:"
                    - generic [ref=f13e6552]:
                      - generic [ref=f13e6553]: //
                      - text: src_x_bit9 (x[9]) selects UL/LL vs UR/LR column.
                    - generic [ref=f13e6557]:
                      - generic [ref=f13e6558]: //
                      - text: src_y_bit8 (y[8]) selects UL/UR vs LL/LR row.
                    - generic [ref=f13e6562]:
                      - generic [ref=f13e6563]: //
                      - text: "Page = {src_y_bit8, src_x_bit9} → 0=UL, 1=UR, 2=LL, 3=LR."
                    - generic [ref=f13e6567]:
                      - generic [ref=f13e6568]: //
                      - text: "UL page = reg_nbg0_page[ 6: 0]"
                    - generic [ref=f13e6572]:
                      - generic [ref=f13e6573]: //
                      - text: "UR page = reg_nbg0_page[14: 8]"
                    - generic [ref=f13e6577]:
                      - generic [ref=f13e6578]: //
                      - text: "LL page = reg_nbg1_page[ 6: 0] (NBG0 second word at $1FF44 offset... see note)"
                    - generic [ref=f13e6582]:
                      - generic [ref=f13e6583]: //
                      - text: "LR page = reg_nbg1_page[14: 8]"
                    - generic [ref=f13e6587]:
                      - generic [ref=f13e6588]: //
                      - text: "NOTE on page register layout (MAME get_tilemaps):"
                    - generic [ref=f13e6592]:
                      - generic [ref=f13e6593]: //
                      - text: "vram[0x1ff40/2 + 2*bgnum + 0]: bits[6:0]=UL page, bits[14:8]=UR page"
                    - generic [ref=f13e6597]:
                      - generic [ref=f13e6598]: //
                      - text: "vram[0x1ff40/2 + 2*bgnum + 1]: bits[6:0]=LL page, bits[14:8]=LR page"
                    - generic [ref=f13e6602]:
                      - generic [ref=f13e6603]: //
                      - text: "For bgnum=0: word 0 = $1FF40 = reg_nbg0_page; word 1 = $1FF42 = reg_nbg1_page"
                    - generic [ref=f13e6607]:
                      - generic [ref=f13e6608]: //
                      - text: "For bgnum=1: word 0 = $1FF42 = reg_nbg1_page; word 1 = $1FF44 = reg_nbg2_page"
                    - generic [ref=f13e6612]:
                      - generic [ref=f13e6613]: //
                      - text: "So for NBG0: UL/UR from reg_nbg0_page[14:0], LL/LR from reg_nbg1_page[14:0]."
                    - generic [ref=f13e6617]:
                      - generic [ref=f13e6618]: //
                      - text: We reuse the already-decoded reg_nbg1_page for NBG0's lower half pages.
                    - generic [ref=f13e6619]: //
                    - generic [ref=f13e6627]:
                      - generic [ref=f13e6628]: //
                      - text: "HBLANK FSM (same pattern as TEXT layer):"
                    - generic [ref=f13e6632]:
                      - generic [ref=f13e6633]: //
                      - text: During HBLANK, prefetch tiles for the next scanline into nbg0_linebuf[].
                    - generic [ref=f13e6637]:
                      - generic [ref=f13e6638]: //
                      - text: "Each tile needs 3 GFX ROM reads (1 map + 2 gfx words): 21 tiles × 3 = 63 cycles."
                    - generic [ref=f13e6642]:
                      - generic [ref=f13e6643]: //
                      - text: GFX ROM shares the single gfx_addr/gfx_data port; NBG0 drives it during HBLANK,
                    - generic [ref=f13e6647]:
                      - generic [ref=f13e6648]: //
                      - text: NBG1 drives it during the second half of HBLANK after NBG0 finishes.
                    - generic [ref=f13e6652]:
                      - generic [ref=f13e6653]: //
                      - text: HBLANK is 208 cycles; NBG0 uses ~84 cycles (21 tiles × 4 FSM states), NBG1 the rest.
                    - generic [ref=f13e6654]: //
                    - generic [ref=f13e6662]:
                      - generic [ref=f13e6663]: //
                      - text: "Output:"
