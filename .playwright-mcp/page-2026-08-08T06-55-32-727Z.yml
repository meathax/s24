                    - generic [ref=f13e5352]: //
                    - generic [ref=f13e5360]:
                      - generic [ref=f13e5361]: //
                      - text: "VRAM port: Uses vram_tf for map reads, vram_sc for gfx reads."
                    - generic [ref=f13e5365]:
                      - generic [ref=f13e5366]: //
                      - text: Both ports have 1-cycle registered latency.
                    - generic [ref=f13e5367]: //
                    - generic [ref=f13e5375]:
                      - generic [ref=f13e5376]: //
