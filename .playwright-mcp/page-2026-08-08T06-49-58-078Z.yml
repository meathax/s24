                  - generic [ref=f5e561]:
                    - generic [ref=f5e562]: //
                    - text: enPhi2 pulses on even clock cycles (2, 4, 6, …)
                  - generic [ref=f5e563]: //
                  - generic [ref=f5e571]:
                    - generic [ref=f5e572]: //
