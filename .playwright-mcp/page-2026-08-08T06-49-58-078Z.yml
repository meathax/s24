                    - generic [ref=f5e597]: //
                    - text: extReset — held high while system reset is active. fx68k samples this
                  - generic [ref=f5e601]:
                    - generic [ref=f5e602]: //
                    - text: synchronously; it must remain asserted for at least 4 clock
                  - generic [ref=f5e606]:
                    - generic [ref=f5e607]: //
                    - text: enables (2 full CPU cycles) after deassertion of the power-on
                  - generic [ref=f5e611]:
                    - generic [ref=f5e612]: //
                    - text: condition.
                  - generic [ref=f5e616]:
                    - generic [ref=f5e617]: //
                    - text: pwrUp — asserted simultaneously with extReset on cold-start to
                  - generic [ref=f5e621]:
                    - generic [ref=f5e622]: //
                    - text: initialise all registers (including PC) to zero. Tie to
                  - generic [ref=f5e626]:
                    - generic [ref=f5e627]: //
                    - text: extReset here; a separate power-up pin is not exposed.
                  - generic [ref=f5e628]: //
                  - generic [ref=f5e636]:
