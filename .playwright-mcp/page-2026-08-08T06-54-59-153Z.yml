                      - text: .eab ( A[23:1] ),
                      - generic [ref=f12e1259]: // word address (bit 0 not present)
                      - text: .iEdb ( cpu_din ),
                      - generic [ref=f12e1260]: // 16-bit read data
                      - text: .oEdb ( cpu_dout ),
                      - generic [ref=f12e1261]: // 16-bit write data
                      - generic [ref=f12e1262]: // Unused outputs — leave open
                      - text: .HALTn ( 1'b1 ),
                      - generic [ref=f12e1263]: // or connect to pause DIP
                      - text: .BGn ( ), .oRESETn ( ), .oHALTEDn ( ), .VMAn ( ), .E ( ) );
                    - button "Copy code to clipboard" [ref=f12e1265] [cursor=pointer]
                  - separator [ref=f12e1269]
                  - generic [ref=f12e1270]:
                    - heading "2. VPAn / Interrupt Acknowledge — CRITICAL" [level=2] [ref=f12e1271]
                    - 'link "Permalink: 2. VPAn / Interrupt Acknowledge — CRITICAL" [ref=f12e1272] [cursor=pointer]':
                      - /url: "#2-vpan--interrupt-acknowledge--critical"
                  - paragraph [ref=f12e1275]:
                    - strong [ref=f12e1276]: Every community core
                    - text: "uses this pattern. Without it, the CPU hangs on IACK:"
                  - generic [ref=f12e1277]:
                    - generic [ref=f12e1278]:
                      - generic [ref=f12e1279]: "// Interrupt acknowledge: FC[2:0]=111 + ASn=0 = IACK cycle"
                      - text: "wire inta_n = ~&{ FC[2], FC[1], FC[0], ~ASn };"
                      - generic [ref=f12e1280]: "// Connect: .VPAn(inta_n)"
                    - button "Copy code to clipboard" [ref=f12e1282] [cursor=pointer]
                  - paragraph [ref=f12e1286]:
                    - strong [ref=f12e1287]: NEVER tie VPAn to 1'b1.
                    - text: When the CPU generates an IACK cycle, it waits indefinitely for either DTACKn or VPAn. If neither asserts, the CPU hangs.
                  - paragraph [ref=f12e1288]: Our fx68k_adapter.sv now handles this internally — no per-core wiring needed.
                  - separator [ref=f12e1289]
                  - generic [ref=f12e1290]:
                    - heading "3. DTACK Generation" [level=2] [ref=f12e1291]
                    - 'link "Permalink: 3. DTACK Generation" [ref=f12e1292] [cursor=pointer]':
                      - /url: "#3-dtack-generation"
                  - generic [ref=f12e1295]:
                    - 'heading "Pattern A: jtframe_68kdtack (recommended for new cores)" [level=3] [ref=f12e1296]'
                    - 'link "Permalink: Pattern A: jtframe_68kdtack (recommended for new cores)" [ref=f12e1297] [cursor=pointer]':
                      - /url: "#pattern-a-jtframe_68kdtack-recommended-for-new-cores"
                  - paragraph [ref=f12e1300]:
                    - text: The jtframe approach generates BOTH clock enables AND DTACKn in a unified module. When SDRAM is busy, it
                    - strong [ref=f12e1301]: stalls the clock enables entirely
                    - text: — the CPU freezes in place.
                  - generic [ref=f12e1302]:
                    - generic [ref=f12e1303]:
                      - generic [ref=f12e1304]: "// Key signals:"
                      - text: "wire bus_cs = |{ rom_cs, ram_cs, vram_cs }; wire bus_busy = |{ rom_cs & ~rom_ok, ram_cs & ~ram_ok, vram_cs & ~vram_ok }; jtframe_68kdtack #(.W(5)) u_dtack ( .rst ( rst ), .clk ( clk_sys ), .cpu_cen ( cpu_cen ),"
                      - generic [ref=f12e1305]: // OUTPUT — feed to fx68k enPhi1
                      - text: .cpu_cenb ( cpu_cenb ),
                      - generic [ref=f12e1306]: // OUTPUT — feed to fx68k enPhi2
                      - text: .bus_cs ( bus_cs ),
                      - generic [ref=f12e1307]: // any SDRAM access pending
                      - text: .bus_busy ( bus_busy ),
                      - generic [ref=f12e1308]: // SDRAM hasn't returned data yet
                      - text: .bus_legit ( 1'b0 ),
                      - generic [ref=f12e1309]: // 0 = recover lost cycles
                      - text: ".ASn ( ASn ), .DSn ( {UDSn, LDSn} ), .num ( 5'd5 ),"
                      - generic [ref=f12e1310]: "// fractional divider: num/den * clk_sys = CPU freq"
                      - text: .den ( 5'd24 ),
                      - generic [ref=f12e1311]: // e.g., 5/24 * 48MHz = 10MHz
                      - text: .DTACKn ( DTACKn ), .wait2 ( 1'b0 ), .wait3 ( 1'b0 ), .fave ( ), .fworst ( ), .frst ( rst ) );
                    - button "Copy code to clipboard" [ref=f12e1313] [cursor=pointer]
                  - paragraph [ref=f12e1317]:
                    - strong [ref=f12e1318]: "DTACK state machine rules:"
                  - list [ref=f12e1319]:
                    - listitem [ref=f12e1320]: DTACKn = 1 during reset, or while ASn is high
                    - listitem [ref=f12e1321]:
                      - text: After ASn goes low,
                      - strong [ref=f12e1322]: one cpu_cen must pass
                      - text: before DTACK can assert (wait1 state)
                    - listitem [ref=f12e1323]: "For fast devices (BRAM, I/O): bus_cs=0 → DTACK asserts after wait1"
                    - listitem [ref=f12e1324]: "For SDRAM: bus_cs=1, bus_busy=1 → halt=1 → cpu_cen stops → CPU frozen until bus_busy=0"
                    - listitem [ref=f12e1325]: DSn rising edge resets DTACKn (for read-modify-write TAS instruction)
                  - generic [ref=f12e1326]:
                    - 'heading "Pattern B: Simple registered DTACK (our current approach, acceptable)" [level=3] [ref=f12e1327]'
                    - 'link "Permalink: Pattern B: Simple registered DTACK (our current approach, acceptable)" [ref=f12e1328] [cursor=pointer]':
                      - /url: "#pattern-b-simple-registered-dtack-our-current-approach-acceptable"
                  - generic [ref=f12e1331]:
                    - generic [ref=f12e1332]:
                      - generic [ref=f12e1333]: "// Fast chip selects: DTACK after 1 pipeline cycle"
                      - text: always_ff @(posedge clk_sys) dtack_r <= any_fast_cs;
                      - generic [ref=f12e1334]: "// ROM: wait for SDRAM handshake"
                      - text: always_comb begin if (cpu_as_n) cpu_dtack_n = 1'b1; else if (rom_cs) cpu_dtack_n = (prog_rom_req != prog_rom_ack);
                      - generic [ref=f12e1335]: // pending
                      - text: else cpu_dtack_n = !dtack_r; end
                    - button "Copy code to clipboard" [ref=f12e1337] [cursor=pointer]
                  - paragraph [ref=f12e1341]: This keeps cpu_cen running and holds DTACKn high during waits. Works but doesn't recover lost clock cycles. Acceptable for cores that don't need cycle-exact timing.
                  - separator [ref=f12e1342]
