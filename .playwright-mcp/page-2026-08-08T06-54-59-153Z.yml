                - article [ref=f12e1222]:
                  - generic [ref=f12e1223]:
                    - heading "fx68k Integration Reference — Consensus Patterns from Community MiSTer Cores" [level=1] [ref=f12e1224]
                    - 'link "Permalink: fx68k Integration Reference — Consensus Patterns from Community MiSTer Cores" [ref=f12e1225] [cursor=pointer]':
                      - /url: "#fx68k-integration-reference--consensus-patterns-from-community-mister-cores"
                  - paragraph [ref=f12e1228]:
                    - strong [ref=f12e1229]: "Sources:"
                    - text: jotego (jtcps1, jts16, jtoutrun), va7deo (ArmedF, Alpha68k), Cave MiSTer (nullobject), psomashekar (Raizing/Batrider), jtframe framework. All patterns verified across 10+ production cores.
                  - paragraph [ref=f12e1230]:
                    - strong [ref=f12e1231]: "Purpose:"
                    - text: This document is the "lantern" — the proven integration patterns that eliminate the need to re-derive bus timing for every new 68000-based arcade system. Every new core MUST follow these patterns.
                  - separator [ref=f12e1232]
                  - generic [ref=f12e1233]:
                    - heading "1. Canonical fx68k Port Map" [level=2] [ref=f12e1234]
                    - 'link "Permalink: 1. Canonical fx68k Port Map" [ref=f12e1235] [cursor=pointer]':
                      - /url: "#1-canonical-fx68k-port-map"
                  - generic [ref=f12e1238]:
                    - generic [ref=f12e1239]:
                      - text: fx68k u_cpu ( .clk ( clk_sys ),
                      - generic [ref=f12e1240]: // system master clock (all regs clock on posedge)
                      - text: .enPhi1 ( cpu_cen ),
                      - generic [ref=f12e1241]: "// 1-cycle pulse: rising edge of CPU clock"
                      - text: .enPhi2 ( cpu_cenb ),
                      - generic [ref=f12e1242]: "// 1-cycle pulse: falling edge of CPU clock"
                      - text: .extReset ( rst ),
                      - generic [ref=f12e1243]: // active-HIGH synchronous reset
                      - text: .pwrUp ( rst ),
                      - generic [ref=f12e1244]: // tie to extReset (all cores do this)
                      - generic [ref=f12e1245]: // Bus outputs (active-LOW)
                      - text: .ASn ( ASn ),
                      - generic [ref=f12e1246]: // address strobe
                      - text: .eRWn ( RnW ),
                      - generic [ref=f12e1247]: // 1=read, 0=write
                      - text: .UDSn ( UDSn ),
                      - generic [ref=f12e1248]: // upper byte strobe
                      - text: .LDSn ( LDSn ),
                      - generic [ref=f12e1249]: // lower byte strobe
                      - generic [ref=f12e1250]: // Bus inputs (active-LOW)
                      - text: .DTACKn ( DTACKn ),
                      - generic [ref=f12e1251]: // data transfer ack
                      - text: .VPAn ( inta_n ),
                      - generic [ref=f12e1252]: // *** MUST use autovector, NOT 1'b1 ***
                      - text: .BERRn ( 1'b1 ),
                      - generic [ref=f12e1253]: // no bus error
                      - text: .BRn ( 1'b1 ),
                      - generic [ref=f12e1254]: // no DMA (or connect to DMA arbiter)
                      - text: .BGACKn ( 1'b1 ),
                      - generic [ref=f12e1255]: // no DMA (or connect to DMA arbiter)
                      - generic [ref=f12e1256]: "// Interrupts (active-LOW; IPL encoding: 111=none, 110=level 1, ..., 000=level 7)"
                      - text: .IPL0n ( ipl_n[0] ), .IPL1n ( ipl_n[1] ), .IPL2n ( ipl_n[2] ),
                      - generic [ref=f12e1257]: // Function codes (for IACK detection)
                      - text: .FC0 ( FC[0] ), .FC1 ( FC[1] ), .FC2 ( FC[2] ),
