                    - generic [ref=f11e5352]: //
                    - generic [ref=f11e5360]:
                      - generic [ref=f11e5361]: //
                      - text: "VRAM port: Uses vram_tf for map reads, vram_sc for gfx reads."
                    - generic [ref=f11e5365]:
                      - generic [ref=f11e5366]: //
