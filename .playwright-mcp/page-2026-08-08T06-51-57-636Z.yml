                    - generic [ref=f11e6619]: //
                    - generic [ref=f11e6627]:
                      - generic [ref=f11e6628]: //
                      - text: "HBLANK FSM (same pattern as TEXT layer):"
                    - generic [ref=f11e6632]:
                      - generic [ref=f11e6633]: //
                      - text: During HBLANK, prefetch tiles for the next scanline into nbg0_linebuf[].
                    - generic [ref=f11e6637]:
                      - generic [ref=f11e6638]: //
                      - text: "Each tile needs 3 GFX ROM reads (1 map + 2 gfx words): 21 tiles × 3 = 63 cycles."
                    - generic [ref=f11e6642]:
                      - generic [ref=f11e6643]: //
                      - text: GFX ROM shares the single gfx_addr/gfx_data port; NBG0 drives it during HBLANK,
                    - generic [ref=f11e6647]:
