                      - text: NBG1 drives it during the second half of HBLANK after NBG0 finishes.
                    - generic [ref=f11e6652]:
                      - generic [ref=f11e6653]: //
                      - text: HBLANK is 208 cycles; NBG0 uses ~84 cycles (21 tiles × 4 FSM states), NBG1 the rest.
                    - generic [ref=f11e6654]: //
                    - generic [ref=f11e6662]:
