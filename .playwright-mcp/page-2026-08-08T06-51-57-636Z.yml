                    - generic [ref=f11e5215]:
                      - generic [ref=f11e5216]: //
                      - text: 8×8 4bpp tiles. Map in VRAM at word base $E000 (= byte $1C000 relative to $300000).
                    - generic [ref=f11e5220]:
                      - generic [ref=f11e5221]: //
                      - text: GFX data in VRAM at word base $F000 (= byte $1E000 relative to $300000).
                    - generic [ref=f11e5222]: //
                    - generic [ref=f11e5230]:
                      - generic [ref=f11e5231]: //
                      - text: "TEXT tile entry (16-bit word):"
                    - generic [ref=f11e5235]:
                      - generic [ref=f11e5236]: //
                      - text: "bits[15:9] : color (7-bit palette bank → palette base = color × 16)"
                    - generic [ref=f11e5240]:
                      - generic [ref=f11e5241]: //
                      - text: "bits[8:0] : tile index (0..511)"
                    - generic [ref=f11e5242]: //
                    - generic [ref=f11e5250]:
                      - generic [ref=f11e5251]: //
                      - text: "Map layout: 64 cols × 32 rows = 2048 entries."
                    - generic [ref=f11e5255]:
                      - generic [ref=f11e5256]: //
                      - text: Word address = map_base + row * 64 + col
                    - generic [ref=f11e5260]:
                      - generic [ref=f11e5261]: //
                      - text: where map_base = $E000 + (reg_text_cfg[8:4] × 0x80) for page select
                    - generic [ref=f11e5265]:
                      - generic [ref=f11e5266]: //
                      - text: "Default (page=0): map_base = $E000"
                    - generic [ref=f11e5267]: //
                    - generic [ref=f11e5275]:
                      - generic [ref=f11e5276]: //
                      - text: "GFX data layout: 512 tiles × 8 rows × 2 words/row = 8192 words starting at $F000."
                    - generic [ref=f11e5280]:
                      - generic [ref=f11e5281]: //
                      - text: tile_base_word = $F000 + tile_idx * 16 + py * 2
                    - generic [ref=f11e5285]:
                      - generic [ref=f11e5286]: //
                      - text: Each row = 2 × 16-bit words = 32 bits total for 8 pixels × 4bpp.
                    - generic [ref=f11e5290]:
                      - generic [ref=f11e5291]: //
                      - text: "Pixel packing (same as Sega S32 TEXT hardware):"
                    - generic [ref=f11e5295]:
                      - generic [ref=f11e5296]: //
                      - text: word0[15:12]=px3, [11:8]=px2, [7:4]=px1, [3:0]=px0
                    - generic [ref=f11e5300]:
                      - generic [ref=f11e5301]: //
                      - text: word1[15:12]=px7, [11:8]=px6, [7:4]=px5, [3:0]=px4
                    - generic [ref=f11e5305]:
                      - generic [ref=f11e5306]: //
                      - text: "With flipX: px order reversed within tile."
                    - generic [ref=f11e5310]:
                      - generic [ref=f11e5311]: //
                      - text: "With flipY: use row (7 - py) instead of py."
                    - generic [ref=f11e5315]:
                      - generic [ref=f11e5316]: //
                      - text: "Note: TEXT tiles have NO flipX/flipY in System 32 — text is fixed orientation."
                    - generic [ref=f11e5317]: //
                    - generic [ref=f11e5325]:
                      - generic [ref=f11e5326]: //
                      - text: "HBLANK FSM: Fill a 320-wide line buffer each HBLANK."
                    - generic [ref=f11e5330]:
                      - generic [ref=f11e5331]: //
                      - text: Need ceil(320/8)+1 = 41 tiles, each requiring 3 VRAM reads (1 map + 2 gfx).
                    - generic [ref=f11e5335]:
                      - generic [ref=f11e5336]: //
                      - text: "Total: 41 × 3 = 123 cycles; HBLANK is 208 cycles → fits easily."
                    - generic [ref=f11e5337]: //
                    - generic [ref=f11e5345]:
                      - generic [ref=f11e5346]: //
                      - text: "Output: text_pix[12:0] = {color[6:0], pen[3:0]}; pen==0 → transparent (color 0)."
                    - generic [ref=f11e5350]:
                      - generic [ref=f11e5351]: //
